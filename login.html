<!DOCTYPE html>
<html lang="en" class="theme-anemo">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveler Login | Teyvat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
    <video class="video-background" autoplay muted loop playsinline aria-label="Background video">
        <source src="Columbina Hyposelenia - Memories of the Moon _ Genshin Impact _ Live Wallpaper 4K60.mp4" type="video/mp4">
    </video>

    <div class="login-shell">
        <div class="login-card">
            <div class="login-header">
                <div class="login-badge">✦ Traveler Access</div>
                <div class="login-vision" aria-label="Genshin elemental theme">
                    <span class="vision-pill active">A</span>
                    <span class="vision-pill">P</span>
                    <span class="vision-pill">H</span>
                    <span class="vision-pill">E</span>
                    <span class="vision-pill">G</span>
                    <span class="vision-pill">C</span>
                    <span class="vision-pill">D</span>
                </div>
            </div>

            <h1>Welcome Back, Traveler</h1>
            <p class="login-subtitle">Please sign in to continue your journey.</p>

            <form action="index.html" method="get" class="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button btn-genshin">Log In</button>

                <p class="signup">
                    Don't have an account?
                    <a href="#">Sign Up</a>
                </p>

                <p class="back-home">
                    <a href="index.html">Back to Home</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
